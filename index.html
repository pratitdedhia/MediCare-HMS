        function goToBookingStep(step, docId) {
            if (step === 3 || step === 4) {
                const dateVal = document.getElementById('booking-date-input')?.value;
                if (!dateVal) {
                    alert("Please select an appointment date first.");
                    return goToBookingStep(2, docId);
                }
                const todayStr = getTodayDateStr();
                if (dateVal < todayStr) {
                    alert("Past dates cannot be booked. Please select today or a future date.");
                    return goToBookingStep(2, docId);
                }
                if (!selectedBookingSlot) {
                    alert("Please select an available time slot before continuing.");
                    return goToBookingStep(2, docId);
                }
            }

            currentBookingStep = step;

            for (let i = 1; i <= 4; i++) {
                const pane = document.getElementById(`booking-step-pane-${i}`);
                const nav = document.getElementById(`step-nav-${i}`);
                const conn = document.getElementById(`step-line-${i}`);
                if (pane) pane.style.display = (i === step ? 'block' : 'none');
                if (nav) {
                    nav.classList.remove('active', 'completed');
                    if (i === step) nav.classList.add('active');
                    else if (i < step) nav.classList.add('completed');
                }
                if (conn) {
                    conn.classList.toggle('completed', i < step);
                }
            }

            if (step === 4) {
                updateBookingReviewSummary(docId);
            }
            if (window.lucide) lucide.createIcons();
        }

        function validateStep2AndProceed(docId) {
            const dateVal = document.getElementById('booking-date-input')?.value;
            if (!dateVal) return alert("Please select an appointment date.");
            const todayStr = getTodayDateStr();
            if (dateVal < todayStr) return alert("Past dates cannot be booked. Please select today or a future date.");
            if (!selectedBookingSlot) return alert("Please select an available time slot before continuing.");
            goToBookingStep(3, docId);
        }

        function checkDoctorAvailabilityForDate(docId, dateVal) {
            selectedBookingSlot = null;
            const confirmBtn = document.getElementById('btn-confirm-doctor-booking');
            if (confirmBtn) confirmBtn.disabled = true;
            
            const alertBox = document.getElementById('booking-date-alert');
            const slotsBox = document.getElementById('booking-slots-container');
            if (!alertBox || !slotsBox) return;

            alertBox.innerHTML = '';
            slotsBox.innerHTML = '';

            if (!dateVal) {
                slotsBox.innerHTML = '<div class="text-muted small py-3 text-center bg-light border rounded"><i data-lucide="calendar" size="20" class="d-block mx-auto mb-1 text-muted"></i>Please select a date to view available time slots.</div>';
                if (window.lucide) lucide.createIcons();
                return;
            }

            const todayStr = getTodayDateStr();
            if (dateVal < todayStr) {
                alertBox.innerHTML = `
                    <div class="alert alert-danger mb-3 py-2 px-3 small fw-bold">
                        ⚠️ Past dates cannot be booked. Please select today or a future date.
                    </div>
                `;
                slotsBox.innerHTML = '<div class="text-muted small py-3 text-center bg-light border rounded text-danger fw-semibold">Backdated appointments are not permitted. Please choose a valid date.</div>';
                return false;
            }

            const db = getDB();
            const doctor = db.doctors.find(d => d.id === docId);
            const user = db.users.find(u => u.id === doctor.user_id);
            const docName = formatDoctorName(user?.full_name);
            
            // Check leave dates
            if (doctor.unavailable_dates && doctor.unavailable_dates.includes(dateVal)) {
                alertBox.innerHTML = `
                    <div class="alert alert-danger mb-3 py-2 px-3 small fw-bold">
                        ⚠️ ${docName} is on leave on ${dateVal}. Please select another date.
                    </div>
                `;
                slotsBox.innerHTML = `<div class="text-muted small py-3 text-center bg-light border rounded text-danger">${docName} is on leave on this date.</div>`;
                return false;
            }

            // Check working days
            const parts = dateVal.split('-');
            const localDate = new Date(parts[0], parts[1] - 1, parts[2]);
            const dayOfWeek = localDate.toLocaleDateString('en-US', { weekday: 'long' });

            if (doctor.available_days && !doctor.available_days.includes(dayOfWeek)) {
                alertBox.innerHTML = `
                    <div class="alert alert-warning mb-3 py-2 px-3 small fw-bold">
                        ⚠️ ${docName} does not consult on ${dayOfWeek}s.<br>
                        Working days: ${doctor.available_days.join(', ')}
                    </div>
                `;
                slotsBox.innerHTML = `<div class="text-muted small py-3 text-center bg-light border rounded text-warning">${docName} does not consult on ${dayOfWeek}s.</div>`;
                return false;
            }

            // Generate slots
            const startStr = doctor.start_time || "09:00";
            const endStr = doctor.end_time || "16:00";
            const duration = doctor.slot_duration || 30;

            const startParts = startStr.split(':');
            const endParts = endStr.split(':');
            const startMins = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
            const endMins = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);

            const isToday = (dateVal === todayStr);
            const now = new Date();
            const currentMinsNow = now.getHours() * 60 + now.getMinutes();

            let slotsHtml = '<div class="row row-cols-3 g-2">';
            let hasSlots = false;
            let availableSlotsCount = 0;

            for (let m = startMins; m <= endMins - duration; m += duration) {
                hasSlots = true;
                const hh = Math.floor(m / 60);
                const mm = m % 60;
                const ampm = hh >= 12 ? 'PM' : 'AM';
                const dispH = hh % 12 || 12;
                const dispM = mm.toString().padStart(2, '0');
                const slotTime = `${dispH}:${dispM} ${ampm}`;

                // Check if already booked
                const isBooked = db.appointments.some(a => 
                    a.doctor_id === docId && 
                    a.appointment_date === dateVal && 
                    a.appointment_time === slotTime &&
                    (a.status === 'Scheduled' || a.status === 'Completed')
                );

                // Check if time slot has already passed today
                const isPastTime = isToday && (m <= currentMinsNow);

                if (isBooked) {
                    slotsHtml += `
                        <div class="col">
                            <button type="button" class="btn btn-sm btn-outline-secondary w-100 disabled" style="opacity: 0.5; font-size: 0.72rem; padding: 0.35rem 0;" disabled title="Slot already booked">
                                ${slotTime} (Booked)
                            </button>
                        </div>
                    `;
                } else if (isPastTime) {
                    slotsHtml += `
                        <div class="col">
                            <button type="button" class="btn btn-sm btn-outline-secondary w-100 disabled" style="opacity: 0.45; font-size: 0.72rem; padding: 0.35rem 0;" disabled title="Time slot has already passed today">
                                ${slotTime} (Passed)
                            </button>
                        </div>
                    `;
                } else {
                    availableSlotsCount++;
                    slotsHtml += `
                        <div class="col">
                            <button type="button" class="btn btn-sm btn-outline-primary w-100 slot-picker-btn" data-time="${slotTime}" onclick="selectBookingTimeSlot(this, '${slotTime}')" style="font-size: 0.72rem; padding: 0.35rem 0;">
                                ${slotTime}
                            </button>
                        </div>
                    `;
                }
            }
            slotsHtml += '</div>';

            if (!hasSlots) {
                slotsBox.innerHTML = '<div class="text-muted small">No slots could be generated for the configured hours.</div>';
            } else if (availableSlotsCount === 0) {
                slotsBox.innerHTML = `
                    <div class="alert alert-secondary py-2 px-3 small text-muted mb-2">
                        No available slots for this date (slots are either booked or already passed). Please select another date.
                    </div>
                    ${slotsHtml}
                `;
            } else {
                slotsBox.innerHTML = `
                    <label class="form-label small fw-bold d-block mb-2">Select Time Slot *</label>
                    ${slotsHtml}
                `;
            }
            return true;
        }

        function downloadMedicalDocumentPDF(docId) {
            const db = getDB();
            if (!window.jspdf || !window.jspdf.jsPDF) {
                alert("PDF engine is initializing, please try again in a moment.");
                return;
            }
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });

            let title = 'Medical Document';
            let type = 'Clinical Record';
            let date = new Date().toISOString().split('T')[0];
            let facility = 'Sunrise Multi-Speciality Hospital';
            let patientName = currentUser?.full_name || 'Patient';
            let patientId = '#PAT-1';
            let lines = [];

            if (String(docId).startsWith('rx-')) {
                const rxId = parseInt(String(docId).replace('rx-', ''));
                const presc = (db.prescriptions || []).find(p => p.id === rxId);
                const mr = presc ? (db.medical_records || []).find(m => m.id === presc.medical_record_id) : null;
                const doc = mr ? (db.doctors || []).find(d => d.id === mr.doctor_id) : null;
                const docUser = doc ? (db.users || []).find(u => u.id === doc.user_id) : null;
                const pat = mr ? (db.patients || []).find(p => p.id === mr.patient_id) : null;
                const patUser = pat ? (db.users || []).find(u => u.id === pat.user_id) : null;

                title = `Prescription by ${formatDoctorName(docUser?.full_name, 'Medical Officer')}`;
                type = 'OPD Clinical Prescription';
                date = mr?.created_at || date;
                facility = `Sunrise Multi-Speciality Hospital &bull; ${formatDoctorName(docUser?.full_name, 'Consultant')}`;
                if (patUser) patientName = patUser.full_name;
                if (pat) patientId = `#PAT-${pat.id}`;

                let meds = [];
                try { meds = JSON.parse(presc.medicines_json); } catch (e) {}
                lines.push(`Clinical Diagnosis: ${mr?.diagnosis || 'Clinical Diagnosis'}`);
                lines.push(`Clinical Notes: ${mr?.clinical_notes || 'Patient reviewed in OPD.'}`);
                lines.push(`Follow-up Instructions: ${presc?.instructions || 'Take as prescribed.'}`);
                lines.push('');
                lines.push('Prescribed Medications:');
                meds.forEach((m, idx) => {
                    lines.push(`  ${idx+1}. ${m.name} | Dosage: ${m.dosage} | Duration: ${m.duration} | Instructions: ${m.instructions || 'After food'}`);
                });
            } else {
                const doc = (db.patient_documents || []).find(d => d.id === parseInt(docId));
                if (!doc) {
                    alert("We couldn't load this document. Please try again.");
                    return;
                }
                if (doc) {
                    title = doc.title;
                    type = doc.document_type;
                    date = doc.document_date;
                    facility = doc.doctor_or_facility || 'Sunrise Diagnostic Labs';
                    const pat = (db.patients || []).find(p => p.id === doc.patient_id);
                    const patUser = pat ? (db.users || []).find(u => u.id === pat.user_id) : null;
                    if (patUser) patientName = patUser.full_name;
                    if (pat) patientId = `#PAT-${pat.id}`;

                    let content = null;
                    try { content = JSON.parse(doc.file_content); } catch (e) {}
                    if (content) {
                        if (content.tests) {
                            lines.push('Diagnostic Test Results:');
                            content.tests.forEach(t => {
                                lines.push(`  - ${t.param}: ${t.result} ${t.unit} (Biological Ref: ${t.ref}) [${t.status}]`);
                            });
                            if (content.summary) lines.push(`\nPathology Impression: ${content.summary}`);
                        } else if (content.medicines) {
                            lines.push('Prescribed Medicines:');
                            content.medicines.forEach((m, idx) => {
                                lines.push(`  ${idx+1}. ${m.name} - ${m.dosage} for ${m.duration} (${m.instructions})`);
                            });
                        }
                    } else {
                        lines.push(`Official record on file at ${facility}.`);
                        lines.push(`Document Category: ${doc.category}`);
                    }
                }
            }

            // Draw PDF Header
            pdf.setFillColor(37, 99, 235);
            pdf.rect(0, 0, 210, 26, 'F');
            pdf.setTextColor(255, 255, 255);
            pdf.setFontSize(16);
            pdf.setFont('helvetica', 'bold');
            pdf.text('SUNRISE MULTI-SPECIALITY HOSPITAL', 14, 12);
            pdf.setFontSize(9);
            pdf.setFont('helvetica', 'normal');
            pdf.text('Department of Clinical Services &bull; Electronic Health Record (EHR)', 14, 18);
            pdf.text('100 Hospital Boulevard, Medical District &bull; Phone: +91 1800 200 4455', 14, 23);

            // Document Details
            pdf.setTextColor(15, 23, 42);
            pdf.setFontSize(14);
            pdf.setFont('helvetica', 'bold');
            pdf.text(title, 14, 38);

            pdf.setFontSize(10);
            pdf.setFont('helvetica', 'normal');
            pdf.text(`Document Type: ${type}`, 14, 45);
            pdf.text(`Date of Issue: ${date}`, 14, 51);
            pdf.text(`Facility / Doctor: ${facility}`, 14, 57);

            // Patient Demographics Box
            pdf.setFillColor(248, 250, 252);
            pdf.rect(14, 62, 182, 18, 'F');
            pdf.setDrawColor(226, 232, 240);
            pdf.rect(14, 62, 182, 18, 'S');

            pdf.setFont('helvetica', 'bold');
            pdf.text(`Patient Name: ${patientName}`, 18, 69);
            pdf.text(`Patient ID: ${patientId}`, 18, 75);
            pdf.text(`Printed On: ${new Date().toLocaleDateString()}`, 120, 69);
            pdf.text(`Status: Verified EHR Copy`, 120, 75);

            // Content lines
            let y = 90;
            pdf.setFont('helvetica', 'normal');
            pdf.setFontSize(10);
            lines.forEach(line => {
                if (y > 270) {

        function createNewLabSlot(e) {
            e.preventDefault();
            const testId = parseInt(document.getElementById('lab-slot-test-id').value);
            const dateVal = document.getElementById('lab-slot-date').value;
            const timeVal = document.getElementById('lab-slot-time').value;
            const operatorVal = document.getElementById('lab-slot-operator').value.trim();

            if (!dateVal || dateVal < getTodayDateStr()) {
                alert("Cannot create lab slots for past dates. Please select today or a future date.");
                return;
            }

            if (isSlotTimePassed(dateVal, timeVal)) {
                alert("Cannot release slots for past times today. Please select a time slot that is in the future.");
                return;
            }

            if (!operatorVal || operatorVal.length < 2) {
                alert("Please provide a valid operator or technician name (at least 2 characters).");
                return;
            }

            const db = getDB();
            
            // Check for duplicates of the same test at same date & time
            const isDuplicate = db.lab_slots.some(s => 
                s.lab_test_id === testId && 
                s.date === dateVal && 
                s.time_slot === timeVal
            );

            if (isDuplicate) {
                alert("A slot for this test at the specified date and time already exists.");
                return;
            }

            // Check for operator collision
            const operatorCollision = db.lab_slots.some(s =>
                s.operator_name.toLowerCase() === operatorVal.toLowerCase() &&
                s.date === dateVal &&
                s.time_slot === timeVal
            );

            if (operatorCollision) {
                alert(`Operator "${operatorVal}" is already assigned to a test at ${timeVal} on ${dateVal}. Please select a different time slot or operator.`);
                return;
            }

            const newSlotId = (db.lab_slots.reduce((max, s) => s.id > max ? s.id : max, 0)) + 1;
            const newSlot = {
                id: newSlotId,
                lab_test_id: testId,
                date: dateVal,
                time_slot: timeVal,
                operator_name: operatorVal,
                status: 'Available',
                booked_by: null
            };

            db.lab_slots.push(newSlot);
            saveDB(db);
            alert("Laboratory testing slot created and released successfully!");
            renderContentView();
        }

        function deleteLabSlot(slotId) {
            const db = getDB();
            const slot = db.lab_slots.find(s => s.id === slotId);
            if (!slot) return alert("Slot not found.");
            if (slot.status === 'Booked') {
                alert("Cannot delete this slot because it has already been booked by a patient. Completed or booked records must be maintained for audit compliance.");

            if (!confirm(`Are you sure you want to delete the ${slot.time_slot} slot on ${slot.date}?`)) return;
            db.lab_slots = db.lab_slots.filter(s => s.id !== slotId);
            saveDB(db);
            alert("Slot deleted successfully.");
            renderContentView();
        }

        function autoSchedulePrescribedLabTests() {
            const db = getDB();
            const patient = db.patients.find(p => p.user_id === currentUser.id);
            const pendingRequests = db.lab_requests.filter(req => req.patient_id === patient.id && req.status === 'Pending');

            if (pendingRequests.length === 0) {
                alert("No pending prescribed lab tests found.");
                return;
            }

            let totalCost = 0;
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const tomorrowStr = tomorrow.toISOString().split('T')[0];

            pendingRequests.forEach(req => {
                const test = db.lab_tests.find(t => t.id === req.lab_test_id);
                if (test) totalCost += test.cost;

                // Find available slot
                let slot = db.lab_slots.find(s => s.lab_test_id === req.lab_test_id && s.status === 'Available');

                if (!slot) {
                    // Fallback slot generation
                    const newSlotId = db.lab_slots.length + 1;
                    slot = {
                        id: newSlotId,
                        lab_test_id: req.lab_test_id,
                        date: tomorrowStr,
                        time_slot: '10:00 AM',
                        operator_name: 'Duty Operator',
                        status: 'Booked',
                        booked_by: patient.id
                    };
                    db.lab_slots.push(slot);
                } else {
                    slot.status = 'Booked';
                    slot.booked_by = patient.id;
                }

                // Update request
                req.status = 'Scheduled';
                req.notes = `Auto-scheduled. Operator: ${slot.operator_name}`;
                req.date = slot.date;
                req.time_slot = slot.time_slot;
                req.operator_name = slot.operator_name;
            });

            // Create bill
            const newBillId = db.bills.length + 1;
            db.bills.push({
                id: newBillId,
                patient_id: patient.id,
                appointment_id: null,
                total_amount: totalCost,
                discount: 0,
                tax: 0,
                net_amount: totalCost,
                status: 'Payment Pending',
                items: pendingRequests.map(r => {
                    const t = db.lab_tests.find(lt => lt.id === r.lab_test_id);
                    return { description: t ? t.test_name : 'Prescribed Lab Test', amount: t ? t.cost : 0 };
                }),
                created_at: new Date().toISOString().split('T')[0]
            });

            saveDB(db);

            // Open checkout payment prompt directly
            showPaymentOptionsModal(totalCost, "Prescribed Lab Diagnostics Checkout", function(paymentStatus, paymentMethod, paymentDetails) {
                const db2 = getDB();
                const bill = db2.bills.find(b => b.id === newBillId);
                if (bill) {
                    bill.status = paymentStatus;
                    bill.payment_method = paymentMethod || '';
                    bill.payment_details = paymentDetails || '';
                }
                saveDB(db2);
                currentTab = 'dashboard';
            }, false, {
                category: 'Laboratory Diagnostics',
                dateTime: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
            });
        }

                            <span class="input-group-text bg-light border-end-0" style="color: #64748b;">
                                <i data-lucide="key-round" size="18"></i>
                            </span>
                            <input type="text" maxlength="6" class="form-control border-start-0 bg-light text-dark" id="guest-otp-code" placeholder="Enter 6-digit code" />
                        </div>
                    </div>

                    <button class="btn btn-primary w-100 py-2.5 fw-bold text-white mb-2" id="btn-guest-otp-login" type="submit" disabled style="background-color: #2563eb !important; border: none; border-radius: 8px;">Verify & Confirm Booking</button>
                </form>
            `;
            showModal(modalHtml, '440px');
        }

        function handleGuestOTPSend() {
            const phoneInput = document.getElementById('guest-otp-phone');
            const phone = phoneInput.value.trim();
            const cleanPhone = formatIndianPhone(phone);
            const phoneRegex = /^\+91\d{10}$/;
            
            if (!phoneRegex.test(cleanPhone)) {
                alert("Please enter a valid 10-digit Indian phone number starting with +91 (e.g. +91 98765 43210).");
                return;
            }

            phoneInput.value = cleanPhone;

            activeGeneratedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            
            const simBox = document.getElementById('guest-otp-simulation-box');
            simBox.innerHTML = `💬 <strong>SMS Simulator:</strong> OTP code sent to <strong>${cleanPhone}</strong> is <span class="bg-warning px-2 py-0.5 rounded fw-bold text-dark" style="font-family: monospace;">${activeGeneratedOTP}</span>`;
            simBox.style.display = 'block';

            document.getElementById('guest-otp-code-group').style.display = 'block';
            document.getElementById('btn-guest-otp-login').disabled = false;

            const sendBtn = document.getElementById('btn-guest-otp-send');
            sendBtn.innerHTML = "Resend OTP Code";
            sendBtn.classList.remove('btn-outline-primary');
            sendBtn.classList.add('btn-outline-secondary');
        }

        function handleGuestOTPVerifyAndLogin(e) {
            e.preventDefault();
            const phoneInput = document.getElementById('guest-otp-phone');
            const phone = phoneInput.value.trim();
            const cleanPhone = formatIndianPhone(phone);
            const enteredOTP = document.getElementById('guest-otp-code').value.trim();

            if (!activeGeneratedOTP || enteredOTP !== activeGeneratedOTP) {
                alert("Incorrect OTP code. Please check the SMS Simulator block and try again.");
                return;
            }

            const db = getDB();

            let loggedInUser = null;

            // Try to find patient with this phone number
            const matchedPatient = db.patients.find(p => {
                const patPhone = (p.phone || '').replace(/[\s-]/g, '');
                return patPhone === cleanPhone;
            });

            if (matchedPatient) {
                const matchedUser = db.users.find(u => u.id === matchedPatient.user_id);
                if (matchedUser) {
                    loggedInUser = matchedUser;
                }
            }

            if (!loggedInUser) {
                // Create a new Quick Patient
                const userId = db.users.length + 1;
                const shortPhone = cleanPhone.slice(-10);
                loggedInUser = {
                    id: userId,
                    full_name: 'Quick Patient (' + shortPhone + ')',
                    email: `quick_${cleanPhone.replace('+', '')}@medicare.com`,
                    role: 'Patient',
                    password: ''
                };
                db.users.push(loggedInUser);

                const patientId = db.patients.length + 1;
                db.patients.push({
                    id: patientId,
                    user_id: userId,
                    phone: cleanPhone,
                    dob: '',
                    gender: '',
                    blood_group: '',
                    emergency_contact: '',
                    address: '',
                    medical_history: '',
                    incomplete: true,
                    insurance_policies: [],
                    past_illnesses: []
                });

                saveDB(db);
            }

            // Log them in!
            loginSession(loggedInUser);
            closeModal();

            // Execute the pending action!
            executeGuestPendingAction();
        }

        function executeGuestPendingAction() {
            if (!guestPendingData) return;

            const db = getDB();
            const patient = db.patients.find(p => p.user_id === currentUser.id);

            if (guestPendingData.type === 'appointment') {
                const doctor = db.doctors.find(d => d.id === guestPendingData.doctorId);
                const docUser = db.users.find(u => u.id === doctor.user_id);
                const aptData = { ...guestPendingData };
                guestPendingData = null;

                showPaymentOptionsModal(doctor.fee, `Doctor Consultation (${formatDoctorName(docUser.full_name)})`, function(paymentStatus, paymentMethod, paymentDetails) {
                    const db2 = getDB();
                    let freshPatient = db2.patients.find(p => p.user_id === currentUser.id);
                    if (!freshPatient) {
                        freshPatient = {
                            id: (db2.patients.reduce((max, p) => p.id > max ? p.id : max, 0)) + 1,
                            user_id: currentUser.id,
                            phone: '+91 98765 43210',
                            dob: '1990-01-01',
                            gender: 'Other',
                            blood_group: 'B+',
                            emergency_contact: '+91 98765 43210',
                            address: 'Healthcare City, India',
                            medical_history: 'None reported',
                            insurance_policies: [],
                            past_illnesses: []
                        };
                        db2.patients.push(freshPatient);
                    }
                    const freshDoctor = db2.doctors.find(d => d.id === aptData.doctorId);

                    const newApt = {
                        id: db2.appointments.length + 1,
                        patient_id: freshPatient.id,
                        doctor_id: aptData.doctorId,
                        department_id: freshDoctor.department_id,
                        appointment_date: aptData.date,
                        appointment_time: aptData.slot,
                        token_number: Math.floor(Math.random() * 20) + 1,
                        status: 'Scheduled',
                        reason: aptData.reason || 'Routine consultation'
                    };
                    db2.appointments.push(newApt);

                    const newBillId = db2.bills.length + 1;
                    db2.bills.push({
                        id: newBillId,
                        patient_id: freshPatient.id,
                        appointment_id: newApt.id,
                        total_amount: freshDoctor.fee,
                        discount: 0,
                        tax: 0,
                        net_amount: freshDoctor.fee,
                        status: paymentStatus,
                        payment_method: paymentMethod || '',
                        payment_details: paymentDetails || '',
                        items: [{ description: `Doctor Consultation - ${formatDoctorName(docUser.full_name)}`, amount: freshDoctor.fee }],
                        created_at: new Date().toISOString().split('T')[0]
                    });

                    saveDB(db2);
                    currentTab = 'dashboard';
                }, false, {
                    doctorName: formatDoctorName(docUser.full_name),
                    specialization: freshDoctor?.specialization || doctor?.specialization,
                    dateTime: `${aptData.date} at ${aptData.slot}`,
                    category: 'Doctor OPD Consultation'
                });
            } 
            
            else if (guestPendingData.type === 'lab') {
                const slot = db.lab_slots.find(s => s.id === guestPendingData.slotId);
                const test = db.lab_tests.find(t => t.id === guestPendingData.testId);
                const labData = { ...guestPendingData };
                guestPendingData = null;

                showPaymentOptionsModal(test.cost, `Laboratory Diagnostics (${test.test_name})`, function(paymentStatus, paymentMethod, paymentDetails) {
                    const db2 = getDB();
                    const freshSlot = db2.lab_slots.find(s => s.id === labData.slotId);
                    const freshTest = db2.lab_tests.find(t => t.id === labData.testId);

                    if (!freshSlot || freshSlot.status !== 'Available') {
                        alert("The selected lab slot was already reserved or is no longer available.");
                        return;
                    }

                    let freshPatient = db2.patients.find(p => p.user_id === currentUser.id);
                    if (!freshPatient) {
                        freshPatient = {
                            id: (db2.patients.reduce((max, p) => p.id > max ? p.id : max, 0)) + 1,
                            user_id: currentUser.id,
                            phone: '+91 98765 43210',
                            dob: '1990-01-01',
                            gender: 'Other',
                            blood_group: 'B+',
                            emergency_contact: '+91 98765 43210',
                            address: 'Healthcare City, India',
                            medical_history: 'None reported',
                            insurance_policies: [],
                            past_illnesses: []
                        };
                        db2.patients.push(freshPatient);
                    }

                    const newBillId = db2.bills.length + 1;
                    db2.bills.push({
                        id: newBillId,
                        patient_id: freshPatient.id,
                        appointment_id: null,
                        total_amount: freshTest.cost,
                        discount: 0,
                        tax: 0,
                        net_amount: freshTest.cost,
                        status: paymentStatus,
                        payment_method: paymentMethod || '',
                        payment_details: paymentDetails || '',
                        items: [{ description: `Lab Test: ${freshTest.test_name}`, amount: freshTest.cost }],
                        created_at: new Date().toISOString().split('T')[0]
                    });

                    db2.lab_requests.push({
                        id: db2.lab_requests.length + 1,
                        appointment_id: null,
                        patient_id: freshPatient.id,
                        doctor_id: null,
                        lab_test_id: labData.testId,
                        status: 'Scheduled',
                        date: freshSlot.date,
                        time_slot: freshSlot.time_slot,
                        operator_name: freshSlot.operator_name,
                        notes: `Booked by patient. Operator: ${freshSlot.operator_name}`,
                        report_url: null,
                        requested_at: new Date().toISOString().split('T')[0]
                    });

                    freshSlot.status = 'Booked';
                    freshSlot.booked_by = freshPatient.id;

                    saveDB(db2);
                    currentTab = 'dashboard';
                }, false, {
                    category: 'Laboratory Diagnostics',
                    dateTime: `${slot.date} at ${slot.time_slot}`,
                    serviceName: test.test_name
                });
            } 
            
            else if (guestPendingData.type === 'pharmacy') {
                guestPendingData = null;
                openStoreCheckoutModal();
            }
        }

        // Profile Line-by-Line List Updaters
        function addInsurancePolicyLine(e) {
            e.preventDefault();
            const provider = document.getElementById('ins-add-provider').value.trim();
            const policy_no = document.getElementById('ins-add-policy-no').value.trim();
            const coverage = parseFloat(document.getElementById('ins-add-coverage').value);

            const db = getDB();
            const patient = db.patients.find(p => p.user_id === currentUser.id);
            if (patient) {
                if (!patient.insurance_policies) patient.insurance_policies = [];
                patient.insurance_policies.push({ provider, policy_no, coverage });
                saveDB(db);
                alert("Insurance policy line added!");
                renderContentView();
            }
        }

        function removeInsurancePolicyLine(idx) {
            const db = getDB();
            const patient = db.patients.find(p => p.user_id === currentUser.id);
            if (patient && patient.insurance_policies) {
                patient.insurance_policies.splice(idx, 1);
                saveDB(db);
                alert("Insurance policy line removed.");
                renderContentView();
            }
        }

        function addMedicalHistoryLine(e) {
            e.preventDefault();
            const condition = document.getElementById('hist-add-condition').value.trim();
            const year = document.getElementById('hist-add-year').value.trim();
            const status = document.getElementById('hist-add-status').value;
            const remarks = document.getElementById('hist-add-remarks').value.trim();

            const db = getDB();
            const patient = db.patients.find(p => p.user_id === currentUser.id);
            if (patient) {
                if (!patient.past_illnesses) patient.past_illnesses = [];
                patient.past_illnesses.push({ condition, year, status, remarks });
                saveDB(db);
                alert("Medical history line added!");
                renderContentView();
            }
        }

        function removeMedicalHistoryLine(idx) {
            const db = getDB();
            const patient = db.patients.find(p => p.user_id === currentUser.id);
            if (patient && patient.past_illnesses) {
                patient.past_illnesses.splice(idx, 1);
                saveDB(db);
                alert("Medical history line removed.");
                renderContentView();
            }
        }

        // Pocket Emergency PDF Wallet Card Generator
        function downloadEmergencyCardPDF(patientId) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({
                orientation: 'landscape',
                unit: 'mm',
                format: [85, 54]
            });
            
            const db = getDB();
            const patient = db.patients.find(p => p.id === patientId);
            const user = db.users.find(u => u.id === patient.user_id);
            
            // Draw red header block
            doc.setFillColor(220, 38, 38);
            doc.rect(0, 0, 85, 8, 'F');
            
            // Red header text
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(7);
            doc.setFont('helvetica', 'bold');
            doc.text('EMERGENCY HEALTH CARD', 4, 5.5);
            doc.setFontSize(5);
            doc.setFont('helvetica', 'normal');
            doc.text('MediCare Sunrise Hospital', 58, 5.5);
            
            // Body text Left Column
            doc.setTextColor(15, 23, 42);
            doc.setFontSize(6);
            doc.setFont('helvetica', 'bold');
            doc.text(`Name: ${user.full_name}`, 4, 13);
            doc.text(`Blood Group: ${patient.blood_group || 'N/A'}`, 4, 17);
            doc.text(`Phone: ${patient.phone || 'N/A'}`, 4, 21);
            doc.text(`Emerg Contact: ${patient.emergency_contact || 'N/A'}`, 4, 25);
            
            // Draw separating vertical line
            doc.setDrawColor(226, 232, 240);
            doc.line(44, 10, 44, 48);
            
            // Draw Insurance info on right side
            doc.setFont('helvetica', 'bold');
            doc.text('INSURANCE POLICIES', 47, 13);
            doc.setFont('helvetica', 'normal');
            let y = 17;
            if (!patient.insurance_policies || patient.insurance_policies.length === 0) {
                doc.text('None linked', 47, y);
            } else {
                patient.insurance_policies.slice(0, 2).forEach(ins => {
                    doc.text(`${ins.provider.substring(0, 15)}`, 47, y);
                    doc.text(`No: ${ins.policy_no.substring(0, 15)}`, 47, y + 2.5);
                    y += 6;
                });
            }
            
            // Draw medical conditions on left bottom
            doc.setFont('helvetica', 'bold');
            doc.text('CHRONIC CONDITIONS', 4, 31);
            doc.setFont('helvetica', 'normal');
            let yIll = 35;
            if (!patient.past_illnesses || patient.past_illnesses.length === 0) {
                doc.text('No conditions logged', 4, yIll);
            } else {
                patient.past_illnesses.slice(0, 3).forEach(ill => {
                    doc.text(`• ${ill.condition.substring(0, 15)} (${ill.status})`, 4, yIll);
                    yIll += 3.5;
                });
            }
            
            // Footer banner
            doc.setFillColor(15, 23, 42);
            doc.rect(0, 49, 85, 5, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(4.5);
            doc.text('In emergency, scan card / log into patient portal. Tel: +91 1800-555-0100', 4, 52.5);
            
            doc.save(`EmergencyCard_${user.full_name.replace(/\s+/g, '_')}.pdf`);
        }

        // SPA Bootstrapper
        window.onload = () => {
            getDB();
            logoutSession(); // Boot to landing page
        };
    </script>
